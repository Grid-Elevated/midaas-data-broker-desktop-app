name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(jq -r '.version' desktop/src-tauri/tauri.conf.json)
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW="$major.$minor.$((patch + 1))"
          echo "new_version=$NEW" >> $GITHUB_OUTPUT

          jq ".version = \"$NEW\"" desktop/src-tauri/tauri.conf.json > tmp.json && mv tmp.json desktop/src-tauri/tauri.conf.json
          jq ".version = \"$NEW\"" desktop/package.json > tmp.json && mv tmp.json desktop/package.json

          echo "Bumped $CURRENT → $NEW"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/tauri.conf.json desktop/package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

  build:
    needs: bump-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v${{ needs.bump-version.outputs.new_version }}
          releaseName: v${{ needs.bump-version.outputs.new_version }}
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  notify:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Send release email via SES
        run: |
          VERSION="v${{ needs.bump-version.outputs.new_version }}"
          RELEASE_URL="https://github.com/Grid-Elevated/midaas-data-broker-desktop-app/releases/tag/${VERSION}"
          DOWNLOAD_URL="https://midaas.ai/dataset-manager"

          aws ses send-email \
            --region us-east-1 \
            --from "noreply@midaas.ai" \
            --destination "ToAddresses=cmalani@heberpower.com,russel.brouillard@gridelevated.com" \
            --message "{
              \"Subject\": {\"Data\": \"MIDAAS Data Broker ${VERSION} Released\", \"Charset\": \"UTF-8\"},
              \"Body\": {
                \"Html\": {
                  \"Charset\": \"UTF-8\",
                  \"Data\": \"<p>A new version of the MIDAAS Data Broker desktop app has been released.</p><p><strong>Version:</strong> ${VERSION}</p><p>Download the latest installer from the Dataset Manager page:</p><p><a href='${DOWNLOAD_URL}'>${DOWNLOAD_URL}</a></p><p>Release details: <a href='${RELEASE_URL}'>${RELEASE_URL}</a></p><br><p>MIDAAS Team</p>\"
                },
                \"Text\": {
                  \"Charset\": \"UTF-8\",
                  \"Data\": \"MIDAAS Data Broker ${VERSION} has been released.\n\nDownload: ${DOWNLOAD_URL}\nRelease: ${RELEASE_URL}\"
                }
              }
            }"
